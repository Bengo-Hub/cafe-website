apiVersion: v1
kind: Secret
metadata:
  name: cafe-website-env
  namespace: cafe
type: Opaque
stringData:
  # ============================================
  # API / SERVICE BASE URLS (production)
  # Must match src/config/env.ts and Dockerfile ARGs. For Next.js, pass these at Docker build time via build.sh.
  # ============================================
  NEXT_PUBLIC_AUTH_SERVICE_URL: "https://sso.codevertexitsolutions.com"
  NEXT_PUBLIC_AUTH_UI_URL: "https://accounts.codevertexitsolutions.com"
  NEXT_PUBLIC_ORDERING_SERVICE_URL: "https://orderapi.codevertexitsolutions.com"
  NEXT_PUBLIC_NOTIFICATIONS_SERVICE_URL: "https://notificationsapi.codevertexitsolutions.com"
  NEXT_PUBLIC_LOGISTICS_SERVICE_URL: "https://logisticsapi.codevertexitsolutions.com"
  NEXT_PUBLIC_TREASURY_SERVICE_URL: "https://booksapi.codevertexitsolutions.com"
  NEXT_PUBLIC_INVENTORY_SERVICE_URL: "https://inventoryapi.codevertexitsolutions.com"
  NEXT_PUBLIC_SITE_URL: "https://theurbanloftcafe.com"
  NEXT_PUBLIC_APP_URL: "https://theurbanloftcafe.com"
  NEXT_PUBLIC_TENANT_SLUG: "urban-loft"
  NEXT_PUBLIC_TENANT_ID: "tenant-urban-loft"

  # ============================================
  # APPLICATION CONFIGURATION
  # ============================================
  NODE_ENV: "production"
  
  # ============================================
  # OPTIONAL SECRETS
  # ============================================
  # NEXT_PUBLIC_MAPBOX_TOKEN: "your-token-here"
  # NEXT_PUBLIC_SENTRY_DSN: "your-dsn-here"
  NEXT_PUBLIC_API_TIMEOUT: "30000"
  NEXT_PUBLIC_API_RETRY_ATTEMPTS: "3"

  # Auth Configuration
  AUTH_SECRET: "bengobox-secret-key-1234567890"
  AUTH_CLIENT_ID: "cafe-website-client"
  AUTH_CLIENT_SECRET: "cafe-website-secret"
