apiVersion: v1
kind: Secret
metadata:
  name: cafe-website-env
  namespace: cafe
type: Opaque
stringData:
  # ============================================
  # API / SERVICE BASE URLS (production)
  # Must match src/config/env.ts and Dockerfile ARGs. For Next.js, pass these at Docker build time via build.sh.
  # ============================================
  NEXT_PUBLIC_AUTH_SERVICE_URL: "https://sso.codevertexafrica.com"
  NEXT_PUBLIC_AUTH_UI_URL: "https://accounts.codevertexafrica.com"
  NEXT_PUBLIC_ORDERING_SERVICE_URL: "https://orderingapi.codevertexafrica.com"
  NEXT_PUBLIC_NOTIFICATIONS_SERVICE_URL: "https://notificationsapi.codevertexafrica.com"
  NEXT_PUBLIC_LOGISTICS_SERVICE_URL: "https://logisticsapi.codevertexafrica.com"
  NEXT_PUBLIC_TREASURY_SERVICE_URL: "https://booksapi.codevertexafrica.com"
  NEXT_PUBLIC_INVENTORY_SERVICE_URL: "https://inventoryapi.codevertexafrica.com"
  NEXT_PUBLIC_SITE_URL: "https://theurbanloftcafe.com"
  NEXT_PUBLIC_APP_URL: "https://theurbanloftcafe.com"
  NEXT_PUBLIC_TENANT_SLUG: "urban-loft"
  NEXT_PUBLIC_TENANT_ID: "tenant-urban-loft"

  # ============================================
  # APPLICATION CONFIGURATION
  # ============================================
  NODE_ENV: "production"
  
  # ============================================
  # OPTIONAL SECRETS
  # ============================================
  # NEXT_PUBLIC_MAPBOX_TOKEN: "your-token-here"
  # NEXT_PUBLIC_SENTRY_DSN: "your-dsn-here"
  NEXT_PUBLIC_API_TIMEOUT: "30000"
  NEXT_PUBLIC_API_RETRY_ATTEMPTS: "3"

  # Auth Configuration
  AUTH_SECRET: "bengobox-secret-key-1234567890"
  AUTH_CLIENT_ID: "cafe-website-client"
  AUTH_CLIENT_SECRET: "cafe-website-secret"

  # ============================================
  # SUPABASE (Team, Shifts, Events, Bookings)
  # Set NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in production;
  # use git secret SUPABASE_PASSWORD (or SUPERBASE_PASSWORD) for DB password in connection strings.
  # ============================================
  NEXT_PUBLIC_SUPABASE_URL: "https://yjdqxbqkmbotujnuffni.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: "sb_publishable_Llifxl8kQgSpMqErTNjiGQ_RzHcP48y"
  # SUPABASE_SERVICE_ROLE_KEY: set in production secrets (from Supabase dashboard → Settings → API)
  # SUPABASE_PASSWORD / SUPERBASE_PASSWORD: set in git secrets for deploy; used to build connection string if needed
